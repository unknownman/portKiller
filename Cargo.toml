[package]
name = "portkill"
version = "0.1.0"
edition = "2024"
description = "Inspect ports. Kill with intent."
readme = "README.md"
license = "MIT"
default-run = "pk"

[[bin]]
name = "pk"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
strip = true
